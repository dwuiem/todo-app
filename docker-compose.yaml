services:
  todo-app:
    build: .
    container_name: todo_app
    restart: no
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8080:8080"
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: no
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: